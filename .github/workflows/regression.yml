name: TradingAI Regression

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pytest && pip install -r ops/requirements.txt

      - name: Run regression tests
        run: python3 -m pytest tests/ -v

      - name: Verify model boundary
        run: |
          MODIFIED=$(git diff --name-only HEAD~1 2>/dev/null | grep -E "backend/regime.py|backend/strategies.py|backend/indicators.py|backend/options.py|backend/outlook.py|backend/scenarios.py|backend/ai_outlook.py|backend/backtest.py" || true)
          if [ -n "$MODIFIED" ]; then
            echo "FAIL: Model files modified in this change:"
            echo "$MODIFIED"
            exit 1
          fi
          echo "PASS: No model files modified"

      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30
