<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Animated six-stop tour of TradingAI.in">
<title>TradingAI.in six-stop tour — Outlook, Inputs, Levels, Learn, Records, Decide. Educational only.</title>
<rect x="0" y="0" width="600" height="300" fill="#f8fafc" rx="12"/>
<rect x="20" y="20" width="165" height="100" fill="#fff" stroke="#2563eb" stroke-width="3" rx="8"/>
<text x="32" y="46" font-size="13" font-weight="bold" fill="#0b1e3a">1 · Outlook</text>
<text x="32" y="66" font-size="11" fill="#475569">NIFTY · BANKNIFTY · VIX</text>
