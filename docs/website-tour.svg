<text x="20" y="285" font-size="12" fill="#0b1e3a">Follow Ravi 09:20 IST: Outlook → Inputs → Levels → Learn → Records → Decide.
<animate attributeName="opacity" values="1;1;0;0" dur="14s" repeatCount="indefinite"/>
</text>
<text x="20" y="285" font-size="12" fill="#0b1e3a" opacity="0">Educational market analytics. Not investment advice. See methodology.
<animate attributeName="opacity" values="0;0;1;1" dur="14s" repeatCount="indefinite"/>
