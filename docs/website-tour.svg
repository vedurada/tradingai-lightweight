<circle cx="60" cy="90" r="8" fill="#2563eb" stroke="#fff" stroke-width="2">
<animate attributeName="cx" values="60;140;220;300;380;460;540;540" dur="14s" repeatCount="indefinite"/>
<animate attributeName="cy" values="90;94;88;82;64;60;72;72" dur="14s" repeatCount="indefinite"/>
