# TradingAI security headers — included in the 443 server block AND every location
# block that defines its own add_header (nginx drops server-level add_headers
# otherwise). Installed to /etc/nginx/snippets/ by deploy-vm.sh.
# NOTE: HSTS lives here because this snippet is only ever included from the
# 443 server block — never from the port-80 block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
