# TradingAI.in nginx site — installed to /etc/nginx/sites-enabled/tradingai
# Exported from production VM 2026-09-10. Change history goes in git.
server {
    listen 80;
    server_name tradingai.in www.tradingai.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tradingai.in www.tradingai.in;

    ssl_certificate /etc/letsencrypt/live/tradingai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradingai.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    root /var/www/tradingai.in/html;
    index index.html;

    location /data/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
