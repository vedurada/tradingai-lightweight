# TradingAI.in nginx site — installed to /etc/nginx/sites-enabled/tradingai
# Exported from production VM 2026-09-10. Change history goes in git.
# NOTE: sites-enabled is included in the http context, so limit_req_zone lives
# at file top level here (it is NOT allowed inside server {}).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name tradingai.in www.tradingai.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tradingai.in www.tradingai.in;

    # Ghost-path guard: the OLD/leaked URL /indices/market.html must never
    # fall through to the SPA try_files fallback (it 200s as text/html and
    # its relative assets/... resolve to /indices/assets = MIME-refused, blank page).
    # Exact-match beats location /, so this 301 wins over try_files. Keep this
    # server_name-adjacent so it lives in the 443 block, NOT the listen 80 one.
    location = /indices/market.html {
        return 301 /market.html;
    }

    ssl_certificate /etc/letsencrypt/live/tradingai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradingai.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;

    # A1: security headers via snippet (included in every self-headered
    # location below — nginx drops server-level add_headers otherwise).
    # HSTS lives in the snippet; the snippet is only included from this
    # 443 block, never from port 80.
    include snippets/tradingai-security-headers.conf;

    root /var/www/tradingai.in/html;
    index index.html;

    # Static assets — cache 1h, immutable for versioned assets
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        include snippets/tradingai-security-headers.conf;
        try_files $uri =404;
    }

    location /data/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include snippets/tradingai-security-headers.conf;
    }

    # S1 (Track C): unmatched *.html must 404, not fall through to index.
    # Regex locations never beat the exact-match ghost guard above, so the
    # /indices/market.html 301 keeps precedence. Extensionless fallback stays.
    error_page 404 /404.html;
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include snippets/tradingai-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include snippets/tradingai-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Portfolio endpoints — no cache (auth-required, user-specific)
    location = /api/portfolio {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/portfolio/ {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # API — 10s cache, serves ~50-100 concurrent on 1 vCPU (was 15-25)
    # Chat endpoints are light: polling 4s/15s per client, but nginx cache makes it ~1 upstream req/10s total
    location /api/chat/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache api_cache;
        proxy_cache_valid 200 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        include snippets/tradingai-security-headers.conf;
        # POST must bypass cache
        proxy_cache_methods GET HEAD;
        proxy_no_cache $http_pragma;
    }
    # A4: metrics carries recon-grade telemetry — never served externally.
    # (Flask also gates non-localhost; this is the outer layer.)
    location = /api/metrics {
        deny all;
    }
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache api_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        include snippets/tradingai-security-headers.conf;
        # keep no-store for non-200, but allow 10s for 200
        proxy_no_cache $http_pragma;
    }
}
